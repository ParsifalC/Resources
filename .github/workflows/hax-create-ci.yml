name: Hax Create Dispatch CI

on:
  pull_request:
    branches: [master]
    paths:
      - "scripts/hax_create_dispatch.py"
      - "scripts/hax_monitor.py"
      - "scripts/monitor_hub.py"
      - "tests/test_hax_create_dispatch.py"
      - ".github/workflows/hax-create-ci.yml"
  workflow_dispatch:
    inputs:
      dispatch_probe:
        description: 'Send an inspect-only probe to private Create (never submit a VPS)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile monitor scripts
        run: python -m py_compile scripts/hax_monitor.py scripts/hax_create_dispatch.py scripts/monitor_hub.py
      - name: Check Hax dispatch unit tests
        run: python -m unittest discover -s tests -p "test_hax_create_dispatch.py" -v
      - name: Probe private Create dispatch without submission
        if: github.event_name == 'workflow_dispatch' && inputs.dispatch_probe
        env:
          HAX_CREATE_DISPATCH_ENABLED: 'true'
          HAX_CREATE_DISPATCH_TOKEN: ${{ secrets.HAX_CREATE_DISPATCH_TOKEN }}
        run: |
          python - <<'PYCODE'
          from datetime import datetime, timezone
          from scripts.hax_create_dispatch import build_create_event, dispatch_create_event, TARGET_DATACENTERS

          # Synthetic evidence is allowed only for this explicit inspect-only probe.
          current = {"checked_at": datetime.now(timezone.utc).isoformat(),
                     "datacenters": list(TARGET_DATACENTERS), "datacenter_source": "dom_select"}
          delta = {"initialized": False, "changed": True,
                   "datacenters": {"added": list(TARGET_DATACENTERS)}, "release_candidates": []}
          event = build_create_event(current, delta)
          event["inspect_only"] = True
          status = dispatch_create_event(event)
          print(f"inspect_only=true event_id={event['event_id']} dispatch={status}")
          if status != "sent":
              raise SystemExit("Private Create dispatch probe failed")
          PYCODE
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Validate workflows with actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
