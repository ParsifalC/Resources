name: Hax Create Dispatch CI

on:
  pull_request:
    branches: [master]
    paths:
      - "scripts/hax_create_dispatch.py"
      - "scripts/monitor_hub.py"
      - "tests/test_hax_create_dispatch.py"
      - ".github/workflows/hax-create-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile monitor scripts
        run: python -m py_compile scripts/hax_create_dispatch.py scripts/monitor_hub.py
      - name: Check Hax dispatch unit tests
        run: python -m unittest discover -s tests -p "test_hax_create_dispatch.py" -v
