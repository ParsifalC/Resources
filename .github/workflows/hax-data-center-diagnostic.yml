name: Hax data-center diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hax-data-center-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe Hax data-center once
        run: |
          python3 scripts/hax_monitor.py --output current.json --diff-output diff.json
          echo '--- data_center_probe ---'
          python3 - <<'PY'
          import json
          probe = json.load(open('current.json'))['data_center_probe']
          print(json.dumps(probe, ensure_ascii=False, indent=2))
          PY
