name: LowEndTalk one-time timestamp diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/let-timestamps.yml"
      - "scripts/let_batch_diagnostic.py"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect giveaway entry timing (one-shot, no retries)
        run: python3 scripts/let_batch_diagnostic.py
