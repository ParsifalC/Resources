name: LowEndTalk one-time timestamp diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/let-timestamps.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public dates once (no retries, no authentication)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          import re, html
          u = "https://lowendtalk.com/discussion/221872/giveaway-by-adminbolt-racknerd-100x-free-vps-for-a-year-20x-lifetime-licenses-lets-talk"
          for page in (1, 3, 6, 7, 9):
              url = u if page == 1 else u + "/p" + str(page)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "ResourcesTimestampCheck/1.0", "Accept": "text/html"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      page_html = response.read(2000000).decode("utf-8", "replace")
                  print(f"PAGE={page} len={len(page_html)}")
                  for m in list(re.finditer(r"(?i)KEYWORD\\s*;|The next 10 comments with the following hash tag", page_html)):
                      pos = m.start()
                      window = page_html[max(0, pos - 12000):pos]
                      ids = re.findall(r"Comment_(\\d+)", window, flags=re.I)
                      times = re.findall(r"<time[^>]*>|datetime\\s*=\\s*['\"][^'\"]+|title\\s*=\\s*['\"][^'\"]+|2026-10-0[89][T ][0-9:]+[^<\s\"]*", window, flags=re.I)
                      print("ANNOUNCEMENT", "comment_ids", ids[-6:], "TIME_ATTRS", times[-10:])
                      print("BEFORE", repr(window[-1400:]))
                      print("AFTER", repr(page_html[pos:pos+400]))
              except Exception as exc:
                  print(f"PAGE {page} ERROR {type(exc).__name__}: {exc}")
          PY
