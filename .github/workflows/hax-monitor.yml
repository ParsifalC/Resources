name: VPS monitor hub

on:
  workflow_dispatch:
  schedule:
    # Watchdog only. Normal continuity is provided by self-dispatch at the end
    # of each long-lived run.
    - cron: "23 */6 * * *"
  push:
    branches: [master]
    paths:
      - "scripts/hax_monitor.py"
      - "scripts/openworld_monitor.py"
      - "scripts/openworld_auth_probe.py"
      - "scripts/monitor_hub.py"
      - ".github/workflows/hax-monitor.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: hax-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are capped at 6 hours. Keep 10 minutes for snapshot
    # persistence, summary/artifact upload, and hand-off.
    timeout-minutes: 350
    env:
      MONITOR_SECONDS: 20400
      HAX_INTERVAL_SECONDS: 300
      HAX_CLEANUP_INTERVAL_SECONDS: 60
      OPENWORLD_INTERVAL_SECONDS: 900
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
      OPENWORLD_SESSIONCOOKIE: ${{ secrets.OPENWORLD_SESSIONCOOKIE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load previous valid snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .monitor-state
          if git fetch origin monitor-state:refs/remotes/origin/monitor-state 2>/dev/null; then
            for file in hax.json openworld.json openworld-inventory.json; do
              git show "origin/monitor-state:${file}" > ".monitor-state/${file}" 2>/dev/null || true
            done
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".monitor-state").glob("*.json")):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  print(f"Loaded {path.name}: valid JSON ({len(json.dumps(value))} bytes)")
              except Exception as exc:
                  print(f"Invalid cached state {path.name}: {type(exc).__name__}: {exc}")
                  path.unlink(missing_ok=True)
          PY

      - name: Run monitor hub
        id: hub
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            extra+=(--manual-artifact)
          fi
          python3 scripts/monitor_hub.py             --duration "$MONITOR_SECONDS"             --hax-interval "$HAX_INTERVAL_SECONDS"             --hax-cleanup-interval "$HAX_CLEANUP_INTERVAL_SECONDS"             --openworld-interval "$OPENWORLD_INTERVAL_SECONDS"             --state-dir .monitor-state             --runtime-dir .monitor-runtime             --summary monitor-summary.md             "${extra[@]}"

      - name: Upload OpenWorld Create VPS page artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: openworld-createvps-page
          path: openworld-createvps.html
          retention-days: 1
          if-no-files-found: warn

      - name: Persist final valid snapshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          snapshots=(.monitor-state/*.json)
          if [ "${#snapshots[@]}" -eq 0 ]; then
            echo "No valid snapshots available; nothing to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmp="$(mktemp -d)"
          cleanup() { git worktree remove "$tmp" --force >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          if git show-ref --verify --quiet refs/remotes/origin/monitor-state; then
            git worktree add "$tmp" -B monitor-state origin/monitor-state
          else
            git worktree add --detach "$tmp" HEAD
            (
              cd "$tmp"
              git checkout --orphan monitor-state
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          for source in "${snapshots[@]}"; do
            cp "$source" "$tmp/$(basename "$source")"
          done

          (
            cd "$tmp"
            git add hax.json openworld.json openworld-inventory.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "chore: update VPS monitor snapshots"
              git push origin HEAD:monitor-state
            else
              echo "Snapshot content unchanged; no commit required."
            fi
          )

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [ -s monitor-summary.md ]; then
            cat monitor-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## VPS monitor hub"
              echo
              echo "Monitor process did not produce a summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Hand off to next run
        if: ${{ success() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Dispatching the next VPS monitor hub run."
          gh workflow run hax-monitor.yml --repo "$GITHUB_REPOSITORY" --ref master
