name: OpenWorld public capacity monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [master]
    paths:
      - "scripts/openworld_monitor.py"
      - "scripts/openworld_auth_probe.py"
      - ".github/workflows/openworld-monitor.yml"

permissions:
  contents: write

concurrency:
  group: openworld-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load previous valid snapshots
        shell: bash
        run: |
          set -euo pipefail
          : > previous.json
          : > previous_inventory.json
          if git fetch origin monitor-state:refs/remotes/origin/monitor-state 2>/dev/null; then
            git show origin/monitor-state:openworld.json > previous.json 2>/dev/null || true
            git show origin/monitor-state:openworld-inventory.json > previous_inventory.json 2>/dev/null || true
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          def load(path):
              try:
                  raw=Path(path).read_text().strip()
                  return json.loads(raw) if raw else {}
              except Exception:
                  return {}
          p=load('previous.json'); counters=p.get('counters') or {}
          monitored={k:counters[k] for k in ('nodes','vps','ips') if k in counters}
          inv=load('previous_inventory.json')
          print('Previous public counters:', json.dumps(monitored, sort_keys=True))
          print('Previous Free inventory:', json.dumps(inv, ensure_ascii=False, sort_keys=True))
          PY

      - name: Probe anonymous public counters
        id: probe
        shell: bash
        run: |
          set +e
          python3 scripts/openworld_monitor.py \
            --previous previous.json \
            --output current.json \
            --diff-output diff.json
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat current.json 2>/dev/null || true
          cat diff.json 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=OpenWorld public probe UNKNOWN::Public counters could not be validated; previous valid state is preserved."
          fi

      - name: Probe authenticated Free inventory
        id: inventory_probe
        if: github.event_name != 'push'
        shell: bash
        env:
          OPENWORLD_SESSIONCOOKIE: ${{ secrets.OPENWORLD_SESSIONCOOKIE }}
        run: |
          set +e
          extra=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            extra+=(--html-output openworld-createvps.html)
          fi
          python3 scripts/openworld_auth_probe.py auth_probe.json "${extra[@]}"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat auth_probe.json 2>/dev/null || true
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          def load(path):
              try:
                  raw=Path(path).read_text().strip()
                  return json.loads(raw) if raw else {}
              except Exception:
                  return {}
          cur=load('auth_probe.json'); prev=load('previous_inventory.json')
          state=cur.get('inventory_state','UNKNOWN')
          valid=cur.get('auth_state')=='AUTHENTICATED' and state in {'AVAILABLE','OUT_OF_STOCK'}
          inv=cur.get('inventory') or {}
          snapshot={
              'status': state,
              'stock': inv.get('free_stock_total'),
              'free_plans': inv.get('free_plans') or [],
              'source': cur.get('source'),
          }
          prev_core={k:prev.get(k) for k in ('status','stock','free_plans','source')}
          initialized=valid and not bool(prev.get('status'))
          changed=valid and not initialized and snapshot != prev_core
          restocked=valid and state=='AVAILABLE' and prev.get('status')=='OUT_OF_STOCK'
          if valid:
              snapshot['checked_at']=cur.get('checked_at')
              Path('inventory_snapshot.json').write_text(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n')
          Path('inventory_diff.json').write_text(json.dumps({
              'valid':valid,'initialized':initialized,'changed':changed,'restocked':restocked,
              'before':prev_core,'after':snapshot if valid else None
          },ensure_ascii=False,indent=2)+'\n')
          for key,val in [('valid',valid),('initialized',initialized),('changed',changed),('restocked',restocked)]:
              print(f"{key}={'true' if val else 'false'}")
          PY
          echo '--- inventory_diff.json ---'
          cat inventory_diff.json
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=OpenWorld session expired::sessioncookie no longer reaches the authenticated Create VPS page."
          elif [ "$rc" -ne 0 ]; then
            echo "::warning title=OpenWorld inventory UNKNOWN::Authenticated inventory could not be validated; previous valid inventory state is preserved."
          fi
          exit 0

      - name: Upload full Create VPS page artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: openworld-createvps-page
          path: openworld-createvps.html
          retention-days: 1
          if-no-files-found: error

      - name: Notify Feishu when Free stock returns
        if: steps.inventory_probe.outputs.restocked == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          a=json.load(open('auth_probe.json')); inv=a.get('inventory') or {}
          stock=inv.get('free_stock_total')
          plans=inv.get('free_plans') or []
          locations=[]
          for p in plans:
              for loc in p.get('locations') or []:
                  if loc.get('available'):
                      name=loc.get('name') or loc.get('code') or 'unknown'
                      if name not in locations: locations.append(name)
          lines=[
              '🚀 OpenWorld Free VPS 补货',
              '━━━━━━━━━━━━━━━━━━',
              '',
              f'✅ 当前状态：AVAILABLE',
              f'📦 Free 库存：{stock if stock is not None else "unknown"}',
              f'🌍 可用地点：{", ".join(locations) if locations else "未标明"}',
              '',
              '🔗 https://openworld.eu.org/createvps',
              '',
              '该结果来自登录态 /createvps 页面中的结构化 Free plan stock；监控仅 GET，不提交创建请求。',
          ]
          text='\n'.join(lines)
          app_id=os.environ.get('FEISHU_APP_ID','').strip(); secret=os.environ.get('FEISHU_APP_SECRET','').strip(); chat_id=os.environ.get('FEISHU_CHAT_ID','').strip()
          if not (app_id and secret and chat_id):
              print('Feishu secrets incomplete; restock detected but notification skipped.',file=sys.stderr); raise SystemExit(0)
          def post(url,payload,headers=None):
              req=urllib.request.Request(url,json.dumps(payload,ensure_ascii=False).encode(),{'Content-Type':'application/json',**(headers or {})},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: data=json.loads(r.read().decode())
              if data.get('code',0) not in (0,'0',None): raise RuntimeError(data)
              return data
          token=post('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',{'app_id':app_id,'app_secret':secret}).get('tenant_access_token')
          query=urllib.parse.urlencode({'receive_id_type':'chat_id'})
          post(f'https://open.feishu.cn/open-apis/im/v1/messages?{query}',{'receive_id':chat_id,'msg_type':'text','content':json.dumps({'text':text},ensure_ascii=False)},{'Authorization':f'Bearer {token}'})
          print('Free restock notification sent.')
          PY

      - name: Notify Feishu on public counter change
        if: steps.probe.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          c=json.load(open('current.json')); d=json.load(open('diff.json'))
          if d.get('initialized') or not d.get('changed'):
              print('No public counter change requiring notification.'); raise SystemExit(0)
          labels={'nodes':'Nodes','vps':'VPS','ips':'IPs'}
          lines=['📡 OpenWorld 公开容量数量变化','━━━━━━━━━━━━━━━━━━','']
          for key,x in (d.get('counters') or {}).items():
              before,after,delta=x.get('before'),x.get('after'),x.get('delta')
              suffix='' if delta is None else f' ({delta:+d})'
              lines.append(f'• {labels.get(key,key)}: {before} → {after}{suffix}')
          lines += ['', '⚠️ 这是公开数量变化；Free VPS 是否有货以登录态库存探针为准。']
          checked=c.get('checked_at')
          if checked:
              try:
                  dt=datetime.fromisoformat(checked.replace('Z','+00:00')); checked=dt.astimezone(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S (UTC+8)')
              except ValueError: pass
          lines += [f'🕒 检测时间：{checked or "unknown"}', '🌐 https://openworld.eu.org/']
          text='\n'.join(lines)
          app_id=os.environ.get('FEISHU_APP_ID','').strip(); secret=os.environ.get('FEISHU_APP_SECRET','').strip(); chat_id=os.environ.get('FEISHU_CHAT_ID','').strip()
          if not (app_id and secret and chat_id):
              print('Feishu secrets incomplete; change detected but notification skipped.',file=sys.stderr); raise SystemExit(0)
          def post(url,payload,headers=None):
              req=urllib.request.Request(url,json.dumps(payload,ensure_ascii=False).encode(),{'Content-Type':'application/json',**(headers or {})},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: data=json.loads(r.read().decode())
              if data.get('code',0) not in (0,'0',None): raise RuntimeError(data)
              return data
          token=post('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',{'app_id':app_id,'app_secret':secret}).get('tenant_access_token')
          query=urllib.parse.urlencode({'receive_id_type':'chat_id'})
          post(f'https://open.feishu.cn/open-apis/im/v1/messages?{query}',{'receive_id':chat_id,'msg_type':'text','content':json.dumps({'text':text},ensure_ascii=False)},{'Authorization':f'Bearer {token}'})
          print('Public counter notification sent.')
          PY

      - name: Decide state persistence
        id: persist_decision
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          public=False; inventory=False
          try:
              d=json.load(open('diff.json'))
              public=bool(d.get('initialized') or d.get('changed')) and '${{ steps.probe.outputs.rc }}' == '0'
          except Exception: pass
          try:
              d=json.load(open('inventory_diff.json'))
              inventory=bool(d.get('valid') and (d.get('initialized') or d.get('changed')))
          except Exception: pass
          print(f"public={'true' if public else 'false'}")
          print(f"inventory={'true' if inventory else 'false'}")
          print(f"persist={'true' if public or inventory else 'false'}")
          PY

      - name: Persist valid state changes
        if: steps.persist_decision.outputs.persist == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          cleanup() { git worktree remove "$tmp" --force >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          if git show-ref --verify --quiet refs/remotes/origin/monitor-state; then
            git worktree add "$tmp" -B monitor-state origin/monitor-state
          else
            git worktree add --detach "$tmp" HEAD
            (cd "$tmp" && git checkout --orphan monitor-state && git rm -rf . >/dev/null 2>&1 || true)
          fi
          if [ "${{ steps.persist_decision.outputs.public }}" = "true" ]; then
            cp current.json "$tmp/openworld.json"
          fi
          if [ "${{ steps.persist_decision.outputs.inventory }}" = "true" ]; then
            cp inventory_snapshot.json "$tmp/openworld-inventory.json"
          fi
          (
            cd "$tmp"
            git add openworld.json openworld-inventory.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "chore: update OpenWorld monitor state"
              git push origin HEAD:monitor-state
            else
              echo "State content unchanged; no commit required."
            fi
          )

      - name: Summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          print('## OpenWorld monitor\n')
          print('- Public counters: `Nodes, VPS, IPs`')
          print('- Free inventory source: `authenticated GET /createvps → plan-card data-plan.stock`')
          print('- Schedule: `every 15 minutes`')
          print('- Create VPS POST/submission: `none`')
          print('- Full HTML artifact: `manual runs only, 1 day retention`')
          try:
              c=json.load(open('current.json')); d=json.load(open('diff.json'))
              print(f"- Public counters: `{json.dumps(c.get('counters',{}),sort_keys=True)}`")
              print(f"- Public changed: `{d.get('changed')}`")
          except Exception as e:
              print(f'- Public probe unavailable: `{type(e).__name__}`')
          if os.path.exists('auth_probe.json'):
              try:
                  a=json.load(open('auth_probe.json')); inv=a.get('inventory') or {}
                  print('\n### Free inventory')
                  print(f"- Auth: `{a.get('auth_state','UNKNOWN')}`")
                  print(f"- State: `{a.get('inventory_state','UNKNOWN')}`")
                  print(f"- Stock: `{inv.get('free_stock_total','unknown')}`")
                  print(f"- Reason: `{a.get('inventory_reason') or 'unknown'}`")
                  print(f"- Free plans: `{json.dumps(inv.get('free_plans',[]),ensure_ascii=False)}`")
              except Exception as e:
                  print(f'- Inventory diagnostics unavailable: `{type(e).__name__}`')
          elif '${{ github.event_name }}' == 'push':
              print('\n### Free inventory\n- State: `SKIPPED on push`')
          PY
