name: OpenWorld public capacity monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [master]
    paths:
      - "scripts/openworld_monitor.py"
      - "scripts/openworld_auth_probe.py"
      - ".github/workflows/openworld-monitor.yml"

permissions:
  contents: write

concurrency:
  group: openworld-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load previous valid snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin monitor-state:refs/remotes/origin/monitor-state 2>/dev/null \
            && git show origin/monitor-state:openworld.json > previous.json 2>/dev/null; then
            echo "Loaded previous OpenWorld snapshot."
            python3 - <<'PY'
          import json
          p=json.load(open('previous.json'))
          counters=p.get('counters') or {}
          monitored={k:counters[k] for k in ('nodes','vps','ips') if k in counters}
          print('Previous checked_at:', p.get('checked_at'))
          print('Previous status:', p.get('status', 'legacy/OK'))
          print('Previous counters:', json.dumps(monitored, sort_keys=True))
          PY
          else
            : > previous.json
            echo "No previous snapshot; this run initializes state."
          fi

      - name: Probe anonymous public counters
        id: probe
        shell: bash
        run: |
          set +e
          python3 scripts/openworld_monitor.py \
            --previous previous.json \
            --output current.json \
            --diff-output diff.json
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Probe exit code: $rc"
          echo "--- current.json ---"
          cat current.json 2>/dev/null || true
          echo "--- diff.json ---"
          cat diff.json 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=OpenWorld probe UNKNOWN::Public counters could not be validated; previous valid state is preserved. See diagnostics above."
          fi

      - name: Probe authenticated Create VPS page
        id: auth_probe
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          OPENWORLD_SESSIONCOOKIE: ${{ secrets.OPENWORLD_SESSIONCOOKIE }}
        run: |
          set +e
          python3 scripts/openworld_auth_probe.py auth_probe.json
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Authenticated probe exit code: $rc"
          echo "--- auth_probe.json ---"
          cat auth_probe.json 2>/dev/null || true
          case "$rc" in
            0)
              echo "Authenticated probe confirmed that sessioncookie alone reaches the Create VPS page."
              ;;
            2)
              echo "::warning title=OpenWorld sessioncookie rejected::sessioncookie alone did not preserve the authenticated Create VPS page."
              ;;
            *)
              echo "::warning title=OpenWorld auth probe UNKNOWN::Could not determine whether sessioncookie alone is sufficient. See diagnostics above."
              ;;
          esac
          exit 0

      - name: Notify Feishu on public counter change
        if: steps.probe.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          c=json.load(open('current.json')); d=json.load(open('diff.json'))
          if d.get('initialized') or not d.get('changed'):
              print('No counter change requiring notification.'); raise SystemExit(0)
          labels={'nodes':'Nodes','vps':'VPS','ips':'IPs'}
          lines=['📡 OpenWorld 公开容量数量变化','━━━━━━━━━━━━━━━━━━','']
          for key,x in (d.get('counters') or {}).items():
              before,after,delta=x.get('before'),x.get('after'),x.get('delta')
              suffix='' if delta is None else f' ({delta:+d})'
              lines.append(f'• {labels.get(key,key)}: {before} → {after}{suffix}')
          lines += ['', '⚠️ 这是匿名公开数量变化信号，不代表 Free VPS 已补货。', '🔒 定时监控不登录、不使用 Session、不提交 Create VPS。']
          checked=c.get('checked_at')
          if checked:
              try:
                  dt=datetime.fromisoformat(checked.replace('Z','+00:00')); checked=dt.astimezone(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S (UTC+8)')
              except ValueError: pass
          lines += [f'🕒 检测时间：{checked or "unknown"}', '🌐 https://openworld.eu.org/']
          text='\n'.join(lines)
          app_id=os.environ.get('FEISHU_APP_ID','').strip(); secret=os.environ.get('FEISHU_APP_SECRET','').strip(); chat_id=os.environ.get('FEISHU_CHAT_ID','').strip()
          if not (app_id and secret and chat_id):
              print('Feishu secrets incomplete; change detected but notification skipped.',file=sys.stderr); raise SystemExit(0)
          def post(url,payload,headers=None):
              req=urllib.request.Request(url,json.dumps(payload,ensure_ascii=False).encode(),{'Content-Type':'application/json',**(headers or {})},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: data=json.loads(r.read().decode())
              if data.get('code',0) not in (0,'0',None): raise RuntimeError(data)
              return data
          token=post('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',{'app_id':app_id,'app_secret':secret}).get('tenant_access_token')
          query=urllib.parse.urlencode({'receive_id_type':'chat_id'})
          post(f'https://open.feishu.cn/open-apis/im/v1/messages?{query}',{'receive_id':chat_id,'msg_type':'text','content':json.dumps({'text':text},ensure_ascii=False)},{'Authorization':f'Bearer {token}'})
          print('Feishu notification sent.')
          PY

      - name: Decide snapshot persistence
        if: steps.probe.outputs.rc == '0'
        id: persist_decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('diff.json'))
          should_persist=bool(d.get('initialized') or d.get('changed'))
          print(f"persist={'true' if should_persist else 'false'}")
          PY
          if grep -q '^persist=true$' "$GITHUB_OUTPUT"; then
            echo "Snapshot persistence required: initial baseline or counters changed."
          else
            echo "Counters unchanged; preserving existing snapshot without a commit."
          fi

      - name: Persist valid snapshot
        if: steps.probe.outputs.rc == '0' && steps.persist_decision.outputs.persist == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          cleanup() { git worktree remove "$tmp" --force >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          if git show-ref --verify --quiet refs/remotes/origin/monitor-state; then
            git worktree add "$tmp" -B monitor-state origin/monitor-state
          else
            git worktree add --detach "$tmp" HEAD
            (cd "$tmp" && git checkout --orphan monitor-state && git rm -rf . >/dev/null 2>&1 || true)
          fi
          cp current.json "$tmp/openworld.json"
          (
            cd "$tmp"
            git add openworld.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update OpenWorld monitor snapshot"
              git push origin HEAD:monitor-state
            else
              echo "Snapshot content unchanged; no commit required."
            fi
          )

      - name: Summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          print('## OpenWorld public capacity monitor\n')
          print('- Anonymous/read-only public probe: `yes`')
          print('- Scheduled authenticated requests: `none`')
          print('- Authenticated Create VPS probe: `workflow_dispatch only, GET only`')
          print('- Create VPS POST/submission: `none`')
          print('- Schedule: `every 15 minutes`')
          print('- Monitored counters: `Nodes, VPS, IPs`')
          print('- State: `monitor-state:openworld.json`')
          try:
              c=json.load(open('current.json')); d=json.load(open('diff.json'))
              print(f"- Public probe status: `{c.get('status','UNKNOWN')}`")
              print(f"- Counters: `{json.dumps(c.get('counters',{}),sort_keys=True)}`")
              print(f"- Changed: `{d.get('changed')}`")
              print(f"- Initial baseline: `{d.get('initialized')}`")
              print(f"- Snapshot persisted: `{'yes' if d.get('initialized') or d.get('changed') else 'no'}`")
              if c.get('errors'): print(f"- Public probe errors: `{json.dumps(c['errors'])}`")
          except Exception as e:
              print(f'- Public diagnostics unavailable: `{type(e).__name__}: {e}`')
          if os.path.exists('auth_probe.json'):
              try:
                  a=json.load(open('auth_probe.json'))
                  diag=a.get('diagnostics') or {}
                  inv=a.get('inventory') or {}
                  print('\n### Authenticated probe')
                  print(f"- State: `{a.get('auth_state','UNKNOWN')}`")
                  print(f"- Cookie scope: `{a.get('cookie_scope','unknown')}`")
                  print(f"- Reason: `{a.get('reason') or 'unknown'}`")
                  print(f"- HTTP status: `{diag.get('http_status','unknown')}`")
                  print(f"- Final URL: `{diag.get('final_url','unknown')}`")
                  print(f"- Title: `{diag.get('title','unknown')}`")
                  print(f"- Content length: `{diag.get('content_length','unknown')}`")
                  print('\n### Free inventory probe')
                  print(f"- State: `{a.get('inventory_state','UNKNOWN')}`")
                  print(f"- Reason: `{a.get('inventory_reason') or 'unknown'}`")
                  print(f"- Free options: `{inv.get('free_plan_option_count','unknown')}`")
                  print(f"- Free enabled: `{inv.get('free_plan_enabled_count','unknown')}`")
                  print(f"- Free selected: `{inv.get('free_plan_selected_count','unknown')}`")
                  print(f"- Usable capacity options: `{inv.get('usable_capacity_option_count','unknown')}`")
                  print(f"- Relevant select counts: `{json.dumps(inv.get('role_select_counts',{}),sort_keys=True)}`")
                  if inv.get('matched_out_of_stock_phrases'):
                      print(f"- Out-of-stock markers: `{json.dumps(inv['matched_out_of_stock_phrases'])}`")
                  if a.get('errors'): print(f"- Errors: `{json.dumps(a['errors'])}`")
              except Exception as e:
                  print(f'- Auth/inventory diagnostics unavailable: `{type(e).__name__}: {e}`')
          else:
              print('\n### Authenticated probe')
              print('- State: `SKIPPED`')
              print('- Reason: `only workflow_dispatch runs perform the authenticated GET`')
          PY
